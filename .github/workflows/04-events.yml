name: 04 - Events

on:
  issues:
    types:
      - opened
      - assigned

  issue_comment:
    types:
      - created

  pull_request_review_comment:
    types:
      - created

jobs:
  inspect-event:
    runs-on: ubuntu-24.04

    permissions:
      issues: write

    steps:
      - name: Inspeccionar evento
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          echo "Evento: $EVENT_NAME"
          echo "Número de issue: $ISSUE_NUMBER"
          echo "Cuerpo del comentario: $COMMENT_BODY"

      - name: Comentar al abrir una issue
        if: ${{ github.event_name == 'issues' && github.event.action == 'opened' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "¡Gracias por abrir esta issue! Hemos recibido tu aporte y lo revisaremos pronto."